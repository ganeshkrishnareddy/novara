# Prepared locally for the NOVARA repository; nothing is deployed by this change.
# Requires repository owner authorization and GitHub Pages enabled in repository
# settings (Settings > Pages > Build and deployment: GitHub Actions).
# Informational static marketing site only - not commercial SaaS.

name: Deploy NOVARA public site to Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'scripts/validate_site.py'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate static site
        run: python scripts/validate_site.py

      - name: Stage static site
        shell: bash
        run: |
          mkdir -p site-dist
          cp -R site/. site-dist/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
